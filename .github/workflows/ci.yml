name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies and validates the wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads the Android runtime jar it runs tests against into the
      # local Maven repository, not the Gradle cache, so it is cached separately.
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
